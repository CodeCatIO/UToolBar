<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1f8"/>
      <stop offset="1" stop-color="#d3e2f0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdcf0"/>
      <stop offset="0.55" stop-color="#e8f3fb"/>
      <stop offset="1" stop-color="#f7d9c4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa7f2"/>
      <stop offset="1" stop-color="#2f7cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#20364a" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#20364a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- 桌面窗口示意 -->
  <g filter="url(#cardShadow)" opacity="0.9">
    <rect x="90" y="80" width="620" height="430" rx="14" fill="#ffffff"/>
    <rect x="90" y="80" width="620" height="40" rx="14" fill="#f3f6fa"/>
    <circle cx="116" cy="100" r="5" fill="#f26d6d"/>
    <circle cx="134" cy="100" r="5" fill="#f2c94c"/>
    <circle cx="152" cy="100" r="5" fill="#6fcf97"/>
    <rect x="118" y="150" width="180" height="12" rx="6" fill="#dde5ee"/>
    <rect x="118" y="178" width="260" height="10" rx="5" fill="#e8eef5"/>
    <rect x="118" y="200" width="220" height="10" rx="5" fill="#e8eef5"/>
    <rect x="118" y="240" width="120" height="88" rx="10" fill="#eef4fa"/>
    <rect x="254" y="240" width="120" height="88" rx="10" fill="#eef4fa"/>
    <rect x="390" y="240" width="120" height="88" rx="10" fill="#eef4fa"/>
    <rect x="118" y="356" width="392" height="10" rx="5" fill="#e8eef5"/>
    <rect x="118" y="382" width="330" height="10" rx="5" fill="#e8eef5"/>
  </g>

  <!-- 贴边把手 -->
  <g filter="url(#shadow)">
    <rect x="1122" y="286" width="18" height="104" rx="9" fill="#ffffff"/>
    <rect x="1128" y="316" width="6" height="44" rx="3" fill="#c9d6e3"/>
  </g>

  <!-- 面板 -->
  <g filter="url(#shadow)">
    <path d="M880,20 H1170 A20,20 0 0 1 1190,40 V635 A20,20 0 0 1 1170,655 H880 Z" fill="url(#sea)"/>
    <path d="M880,20 H1170 A20,20 0 0 1 1190,40 V635 A20,20 0 0 1 1170,655 H880 Z" fill="#ffffff" opacity="0.35"/>

    <!-- 顶栏 -->
    <rect x="904" y="44" width="26" height="26" rx="9" fill="url(#accent)"/>
    <rect x="908" y="52" width="18" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="940" y="63" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b3a4a">贴边</text>

    <!-- 图标坞 -->
    <g fill="#6b7f93">
      <rect x="1034" y="48" width="16" height="16" rx="4"/>
      <rect x="1062" y="48" width="16" height="16" rx="4"/>
      <rect x="1090" y="48" width="16" height="16" rx="4"/>
      <rect x="1118" y="48" width="16" height="16" rx="4"/>
    </g>

    <!-- 待办卡片 -->
    <rect x="900" y="96" width="268" height="196" rx="16" fill="#ffffff" opacity="0.94"/>
    <text x="920" y="126" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#34465a">今日待办</text>
    <g>
      <circle cx="928" cy="154" r="7" fill="none" stroke="#9fb4c8" stroke-width="1.6"/>
      <rect x="946" y="149" width="150" height="10" rx="5" fill="#e7eef6"/>
      <circle cx="928" cy="186" r="7" fill="none" stroke="#9fb4c8" stroke-width="1.6"/>
      <rect x="946" y="181" width="188" height="10" rx="5" fill="#e7eef6"/>
      <circle cx="928" cy="218" r="7" fill="#2f7cf6"/>
      <rect x="946" y="213" width="120" height="10" rx="5" fill="#dfe9f4"/>
      <rect x="946" y="236" width="96" height="8" rx="4" fill="#ecf2f8"/>
    </g>
    <rect x="920" y="262" width="228" height="1" fill="#eef3f8"/>

    <!-- 便签卡片 -->
    <g transform="rotate(-2 1034 400)">
      <rect x="914" y="320" width="240" height="170" rx="14" fill="#fff4c9"/>
      <rect x="936" y="344" width="150" height="10" rx="5" fill="#eddf9f"/>
      <rect x="936" y="368" width="196" height="9" rx="4.5" fill="#f2e6b4"/>
      <rect x="936" y="388" width="170" height="9" rx="4.5" fill="#f2e6b4"/>
      <rect x="936" y="408" width="188" height="9" rx="4.5" fill="#f2e6b4"/>
      <rect x="936" y="436" width="90" height="9" rx="4.5" fill="#eddf9f"/>
    </g>

    <!-- 录屏工具条 -->
    <g transform="translate(902, 548)">
      <rect x="0" y="0" width="266" height="44" rx="22" fill="#ffffff" stroke="#e2e6ec"/>
      <text x="18" y="27" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="11" fill="#6b7280">MP4</text>
      <circle cx="62" cy="22" r="6" fill="#2f7cf6"/>
      <text x="76" y="27" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="11" fill="#6b7280">GIF</text>
      <circle cx="108" cy="22" r="6" fill="none" stroke="#c3cbd6" stroke-width="1.5"/>
      <rect x="128" y="10" width="58" height="24" rx="12" fill="#f3f6fa"/>
      <text x="143" y="27" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="11" fill="#55677a">标清</text>
      <rect x="200" y="10" width="44" height="24" rx="12" fill="#f04a4f"/>
      <text x="212" y="27" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="11" fill="#ffffff">录制</text>
    </g>
  </g>

  <!-- 提示气泡 -->
  <g filter="url(#cardShadow)">
    <rect x="452" y="20" width="300" height="34" rx="17" fill="#ffffff" opacity="0.96"/>
    <text x="472" y="42" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="12" fill="#6b7f93">Ctrl + Alt + B 随时呼出贴边面板</text>
  </g>
</svg>
